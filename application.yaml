apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app-web
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://gitlab.com/nanuchi/argocd-app-config.git
    targetRevision: HEAD
    path: dev
  destination: 
    server: git@github.com:rembun/argocd.git
    namespace: myapp-v1

  syncPolicy:
    syncOptions:
    - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true
