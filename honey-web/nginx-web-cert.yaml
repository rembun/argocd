apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nginx-web-tls
  namespace:my-app-web
spec:
  secretName: nginx-web-tls
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 2048
  dnsNames:
    - nginx-web.vega.com
  issuerRef:
    name: vega-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io