apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-web
  namespace: myapp-v1
spec:
  selector:
    matchLabels:
      app: myapp-web
  replicas: 2
  template:
    metadata:
      labels:
        app: myapp-web
    spec:
      containers:
      - name: myapp-web
        image: nginx:latest   # Replace with the correct Nginx image
        ports:
        - containerPort: 80

