---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app-stagging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: stg
  source:
    repoURL: https://github.com/rembun/argocd.git 
    targetRevision: HEAD
    path: stagging
  destination:
    server: https://kubernetes.default.svc
    namespace: my-app-stagging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
