apiVersion: apps/v1
kind: Deployment
metadata:
  # any Deployment name
  name: nginx-nfs
  namespace: my-app-qa
  labels:
    name: nginx-nfs
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-nfs
  template:
    metadata:
      labels:
        app: nginx-nfs
    spec:
      containers:
      - name: nginx-nfs
        imagePullPolicy: IfNotPresent
        image: rembun/devops:car-web
        ports:
          - name: web
            containerPort: 80
       imagePullSecrets:
         - name: dockerhub-argocd
        volumeMounts:
          - name: nfs-share
            # mount point in container
            mountPath: /usr/share/nginx/html
      volumes:
        - name: nfs-share
          persistentVolumeClaim:
            # PVC name you created
            claimName: nfs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service-qa
  namespace: my-app-qa
spec:
  type: NodePort
  selector:
    app: nginx-nfs
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30006
